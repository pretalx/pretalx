name: Build and deploy

on:
  push:
    branches: [ main, ecs-deploy ]
    paths-ignore:
      - 'doc/**'
      - 'src/pretalx/locale/**'
  workflow_dispatch:

# Deploys run one at a time and are never cancelled mid-rollout.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # OIDC: assume the deploy role from wf-org/infra

# Repository variables are written by wf-org/infra (stacks/apps/pretalx/registry):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_APP
jobs:
  build:
    name: Build and push image
    # The ECS tasks run on ARM64 (container_cpu_architecture in wf-org/infra)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            PRETALX_PLUGINS=${{ vars.PRETALX_PLUGINS }}
          # Deployed by this tag (see the deploy job); never by a moving tag.
          tags: |
            ${{ vars.ECR_REPOSITORY_APP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update config and redeploy
    needs: build
    runs-on: ubuntu-24.04
    env:
      SSM_PREFIX: /pretalx/app
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install sops
        env:
          SOPS_VERSION: 3.13.3
          # From sops-v3.13.3.checksums.txt on the release page
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops

      # deploy/prod/env -> SSM String <SSM_PREFIX>/env (PRETALX_APP_ENV)
      # deploy/prod/pretalx.secrets.enc.ini -> SSM SecureString <SSM_PREFIX>/config
      # (PRETALX_APP_CONFIG). The task definitions in wf-org/infra read both at
      # task start; deploy/docker/entrypoint.bash applies them.
      - name: Store app config in Parameter Store
        run: |
          set -euo pipefail
          umask 077
          config="$RUNNER_TEMP/pretalx.cfg"
          param="$RUNNER_TEMP/param.json"
          trap 'rm -f "$config" "$param"' EXIT

          # put <name> <type> <file>; the value goes in through a 0600 file,
          # never the command line or the log
          put() {
            jq -Rs --arg name "$1" --arg type "$2" \
              '{Name: $name, Value: ., Type: $type, Overwrite: true}' "$3" > "$param"
            aws ssm put-parameter --cli-input-json "file://$param" --output text > /dev/null
            echo "stored $1"
          }

          bad=$(grep -nvE '^[[:space:]]*(#.*)?$|^[[:space:]]*(export )?[A-Za-z_][A-Za-z0-9_]*=' deploy/prod/env || true)
          [ -z "$bad" ] || { echo "::error::deploy/prod/env has lines that aren't KEY=value:"; echo "$bad"; exit 1; }
          put "$SSM_PREFIX/env" String deploy/prod/env

          if [ -f deploy/prod/pretalx.secrets.enc.ini ]; then
            sops decrypt deploy/prod/pretalx.secrets.enc.ini > "$config"
          else
            echo "::notice::deploy/prod/pretalx.secrets.enc.ini not found; storing an empty config"
            echo "; no app config" > "$config"
          fi
          # Fail here rather than at container start on a config pretalx can't parse
          python3 -c 'import configparser, sys; configparser.RawConfigParser().read(sys.argv[1], encoding="utf-8")' "$config" ||
            { echo "::error::pretalx.secrets.enc.ini is not a valid cfg file"; exit 1; }
          put "$SSM_PREFIX/config" SecureString "$config"

      # The task definitions use the :latest tag, so a new deployment pulls the
      # image pushed above and reads the config stored above. The cron task
      # picks both up on its next scheduled run.
      - name: Redeploy services
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICES: ${{ vars.ECS_SERVICE_WEB }} ${{ vars.ECS_SERVICE_WORKER }}
        run: |
          set -euo pipefail
          deployed=()
          for service in $SERVICES; do
            status=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
              --query 'services[0].status' --output text)
            # The worker exists only with redis_enabled in wf-org/infra
            if [ "$status" != "ACTIVE" ]; then
              echo "::notice::$service is not active ($status); skipped"
              continue
            fi
            aws ecs update-service --cluster "$CLUSTER" --service "$service" \
              --force-new-deployment --query 'service.serviceName' --output text
            deployed+=("$service")
          done
          [ "${#deployed[@]}" -gt 0 ] || { echo "::error::No active services to deploy"; exit 1; }
          # Fails if a deployment doesn't settle (the circuit breaker rolls back)
          aws ecs wait services-stable --cluster "$CLUSTER" --services "${deployed[@]}"
