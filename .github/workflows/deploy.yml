name: Build and deploy

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'doc/**'
      - 'src/pretalx/locale/**'
  workflow_dispatch:

# Deploys run one at a time and are never cancelled mid-rollout.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # OIDC: assume the deploy role from wf-org/infra

# Repository variables are written by wf-org/infra (stacks/apps/pretalx/registry):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_APP, ECS_CLUSTER,
#   ECS_SERVICE_WEB, ECS_SERVICE_WORKER
jobs:
  build:
    name: Build and push image
    # The ECS tasks run on ARM64 (container_cpu_architecture in wf-org/infra)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            PRETALX_PLUGINS=${{ vars.PRETALX_PLUGINS }}
          # Deployed by this tag (see the deploy job); never by a moving tag.
          tags: |
            ${{ vars.ECR_REPOSITORY_APP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    env:
      CLUSTER: ${{ vars.ECS_CLUSTER }}
      IMAGE: ${{ vars.ECR_REPOSITORY_APP }}:${{ github.sha }}
      SSM_PREFIX: /pretalx/app
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install sops
        env:
          SOPS_VERSION: 3.13.3
          # From sops-v3.13.3.checksums.txt on the release page
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl -fsSLo "$RUNNER_TEMP/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "$SOPS_SHA256  $RUNNER_TEMP/sops" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/sops" /usr/local/bin/sops

      # Same layout as wf-org/volunteer-next: plain settings in deploy/prod/env,
      # secrets in deploy/prod/env.secrets.enc (SOPS, KMS alias/sops; edit with
      # `sops deploy/prod/env.secrets.enc`), both KEY=value lines.
      #   deploy/prod/env            -> SSM String      <SSM_PREFIX>/env    (PRETALX_APP_ENV)
      #   deploy/prod/env.secrets.enc -> SSM SecureString <SSM_PREFIX>/config (PRETALX_APP_CONFIG)
      # The task definitions (wf-org/infra app-config.tf) read both at task
      # start; deploy/docker/entrypoint.bash exports them. Stored before the
      # deploy below, so the new tasks get this config.
      - name: Store app config in Parameter Store
        run: |
          set -euo pipefail
          umask 077
          secrets="$RUNNER_TEMP/secrets.env"
          plain_json="$RUNNER_TEMP/plain.json"
          secrets_json="$RUNNER_TEMP/secrets.json"
          value="$RUNNER_TEMP/value.env"
          param="$RUNNER_TEMP/param.json"
          trap 'rm -f "$secrets" "$plain_json" "$secrets_json" "$value" "$param"' EXIT

          sops -d deploy/prod/env.secrets.enc > "$secrets"

          # Writes a KEY=value file to $2 as a JSON object; empty values are skipped.
          # With $3 = secret, values are masked and lines are never echoed.
          env_to_json() {
            local file=$1 out=$2 kind=${3:-plain} json='{}' line key value
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              line="${line#"${line%%[![:space:]]*}"}"
              case "$line" in '' | '#'*) continue ;; esac
              line="${line#export }"
              key="${line%%=*}"
              value="${line#*=}"
              if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ && "$line" == *=* ]]; then
                if [ "$kind" = secret ]; then
                  echo "::error::$file has a line that isn't KEY=value"
                else
                  echo "::error::$file has a line that isn't KEY=value: $line"
                fi
                exit 1
              fi
              if [[ "$value" =~ ^\"(.*)\"$ || "$value" =~ ^\'(.*)\'$ ]]; then value="${BASH_REMATCH[1]}"; fi
              if [ -z "$value" ]; then
                echo "::notice::$key is empty in $file; skipped"
                continue
              fi
              if [ "$kind" = secret ]; then echo "::add-mask::$value"; fi
              json=$(jq -c --arg k "$key" --arg v "$value" '. + {($k): $v}' <<< "$json")
            done < "$file"
            printf '%s\n' "$json" > "$out"
          }

          env_to_json "$secrets" "$secrets_json" secret
          [ "$(jq length "$secrets_json")" -gt 0 ] ||
            { echo "::error::No secrets found in env.secrets.enc"; exit 1; }
          env_to_json deploy/prod/env "$plain_json"

          jq -r --slurpfile s "$secrets_json" 'keys[] | select(in($s[0]))' "$plain_json" |
            while IFS= read -r key; do
              echo "::warning::$key is in both deploy/prod/env and env.secrets.enc; using the secret"
            done

          # put <name> <type> <json file>: stores the object as KEY=value lines.
          # The value goes in through a 0600 file, never the command line or the log.
          put() {
            jq -r 'to_entries[] | "\(.key)=\(.value)"' "$3" > "$value"
            [ -s "$value" ] || echo "# none" > "$value"
            jq -Rs --arg name "$1" --arg type "$2" \
              '{Name: $name, Value: ., Type: $type, Overwrite: true}' "$value" > "$param"
            aws ssm put-parameter --cli-input-json "file://$param" --output text > /dev/null
            echo "stored $1 ($(jq -r 'keys | join(" ")' "$3"))"
          }
          put "$SSM_PREFIX/env" String "$plain_json"
          put "$SSM_PREFIX/config" SecureString "$secrets_json"

      # Current task definitions; the families are named like the services.
      # The worker service exists only with redis_enabled in wf-org/infra.
      - name: Fetch task definitions
        id: fetch
        env:
          WEB: ${{ vars.ECS_SERVICE_WEB }}
          WORKER: ${{ vars.ECS_SERVICE_WORKER }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$WEB" --query taskDefinition > web.json
          aws ecs describe-task-definition --task-definition "${WEB%-web}-cron" --query taskDefinition > cron.json
          status=$(aws ecs describe-services --cluster "$CLUSTER" --services "$WORKER" --query 'services[0].status' --output text)
          if [ "$status" = ACTIVE ]; then
            aws ecs describe-task-definition --task-definition "$WORKER" --query taskDefinition > worker.json
            echo "worker=true" >> "$GITHUB_OUTPUT"
          fi

      # The bootstrap container (writes pretalx.cfg) runs the app image too
      - name: Web task definition
        id: web-bootstrap
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: web.json
          container-name: bootstrap
          image: ${{ env.IMAGE }}
      - id: web
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.web-bootstrap.outputs.task-definition }}
          container-name: pretalx-web
          image: ${{ env.IMAGE }}

      - name: Deploy web
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_WEB }}
          cluster: ${{ env.CLUSTER }}

      - name: Worker task definition
        id: worker-bootstrap
        if: steps.fetch.outputs.worker == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker.json
          container-name: bootstrap
          image: ${{ env.IMAGE }}
      - id: worker
        if: steps.fetch.outputs.worker == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.worker-bootstrap.outputs.task-definition }}
          container-name: pretalx-worker
          image: ${{ env.IMAGE }}

      - name: Deploy worker
        if: steps.fetch.outputs.worker == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_WORKER }}
          cluster: ${{ env.CLUSTER }}

      - name: Cron task definition
        id: cron-bootstrap
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: cron.json
          container-name: bootstrap
          image: ${{ env.IMAGE }}
      - id: cron
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.cron-bootstrap.outputs.task-definition }}
          container-name: pretalx-cron
          image: ${{ env.IMAGE }}

      # Without a service, the action only registers the revision
      - name: Register cron task definition
        id: cron-register
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.cron.outputs.task-definition }}

      # EventBridge Scheduler runs a pinned revision; point it at the new one
      - name: Update cron schedule
        env:
          SCHEDULE: ${{ vars.ECS_SERVICE_WEB }}
          TASK_DEFINITION: ${{ steps.cron-register.outputs.task-definition-arn }}
        run: |
          set -euo pipefail
          aws scheduler get-schedule --name "${SCHEDULE%-web}-cron" --group-name default --output json |
            jq --arg td "$TASK_DEFINITION" '
              .Target.EcsParameters.TaskDefinitionArn = $td
              | {Name, GroupName, Description, ScheduleExpression, ScheduleExpressionTimezone,
                 StartDate, EndDate, State, KmsKeyArn, ActionAfterCompletion, FlexibleTimeWindow, Target}
              | with_entries(select(.value != null))' > schedule.json
          aws scheduler update-schedule --cli-input-json file://schedule.json --output text > /dev/null
          echo "cron -> $TASK_DEFINITION"
