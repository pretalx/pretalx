; From https://github.com/pretalx/pretalx-docker/blob/789cc5801941f78c24b4bd4f9a6846c23a086054/deployment/docker/supervisord.conf (unchanged)
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:pretalxweb]
command=/usr/local/bin/pretalx webworker
autostart=true
autorestart=true
priority=5
user=pretalxuser
environment=HOME=/pretalx

[program:pretalxtask]
command=/usr/local/bin/pretalx taskworker
autostart=true
autorestart=true
priority=5
user=pretalxuser
