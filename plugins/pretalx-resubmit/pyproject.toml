[project]
name = "pretalx-resubmit"
version = "0.1.0"
description = "Let speakers resubmit a proposal to another event of the same organiser"
requires-python = ">=3.10"
# pretalx: the series this plugin is tested against. It builds proposals with
# pretalx's internal submission functions, so widen this only after the tests
# pass on the new version.
dependencies = ["pretalx>=2026.2.1,<2026.3"]

[project.entry-points."pretalx.plugin"]
pretalx_resubmit = "pretalx_resubmit:PretalxPluginMeta"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pretalx_resubmit*"]

[tool.setuptools.package-data]
pretalx_resubmit = ["static/**/*", "templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "resubmit_test_settings"
pythonpath = ["tests"]
testpaths = ["tests"]
# Runs real migrations, so the plugin's migration is exercised too
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::RuntimeWarning"]
