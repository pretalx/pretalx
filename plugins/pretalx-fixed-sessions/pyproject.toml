[project]
name = "pretalx-fixed-sessions"
version = "0.1.0"
description = "Core sessions whose title and description are set by the organisers"
requires-python = ">=3.10"
# pretalx: the series this plugin is tested against. It enforces content on
# Submission.save() and relies on the CfP form's field ids, so widen this only
# after the tests pass on the new version.
dependencies = ["pretalx>=2026.2.1,<2026.3"]

[project.entry-points."pretalx.plugin"]
pretalx_fixed_sessions = "pretalx_fixed_sessions:PretalxPluginMeta"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pretalx_fixed_sessions*"]

[tool.setuptools.package-data]
pretalx_fixed_sessions = ["static/**/*", "templates/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fixed_sessions_test_settings"
pythonpath = ["tests"]
testpaths = ["tests"]
# Runs real migrations, so the plugin's migration is exercised too
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::RuntimeWarning"]
